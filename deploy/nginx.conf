server {
    listen 80 default_server;
    server_name _;           # certbot will fill your real domain in when you run it

    client_max_body_size 300m;       # editor uploads (images / videos / audio)

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # the app relies on this header (do not remove)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
