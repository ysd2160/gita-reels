<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Video editor</title>
<style>
:root{--bg:#0b0d12;--s0:#10131a;--s1:#151922;--s2:#1b202b;--s3:#242a38;--line:#262c3a;--line2:#323a4d;--text:#e8eaf0;--mute:#8b93a7;--dim:#5d6577;--accent:#e5b04b;--blue:#3b82c4;--green:#2f9e7a;--purple:#8b5cf6;--indigo:#5b5bd6;--teal:#14a3a3;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body,#root{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-size:13px;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{background:var(--s0);border:1px solid var(--line);border-radius:6px;padding:6px 9px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)} input[type=color]{padding:2px;height:32px} input[type=checkbox]{width:auto} input[type=file]{padding:5px}
textarea{resize:vertical}
.center{height:100%;display:grid;place-content:center;gap:12px;text-align:center;color:var(--mute)}
.grow{flex:1}.mut{color:var(--mute);font-size:12px}.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--s2);cursor:pointer;font-weight:500;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--s3)}.btn.sm{padding:5px 9px;font-size:12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1400;font-weight:600}.btn.primary:hover{filter:brightness(1.08)}.btn.bad:hover{color:#ef6a6a}.btn:disabled{opacity:.45;pointer-events:none}
.btn.ic{padding:5px 8px;min-width:30px;justify-content:center}

/* ---- shell: header / (bin + monitor) / splitter / (inspector + timeline) ; right edge tab strip ---- */
.ed{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 54px;grid-template-rows:44px minmax(0,1fr) 6px var(--bh,330px)}
.ed>header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--s1)}
.ed>header b{max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(300px,40%) minmax(0,1fr);min-height:0}
.split{grid-column:1;grid-row:3;background:var(--line);cursor:ns-resize}.split:hover{background:var(--accent)}
.bot{grid-column:1;grid-row:4;display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);min-height:0}
.strip{grid-column:2;grid-row:2/5;background:var(--s1);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding-top:6px}
.strip button{background:none;border:0;border-left:3px solid transparent;color:var(--mute);cursor:pointer;padding:14px 0;font-size:10px;font-weight:700;letter-spacing:.8px}
.strip button:hover{color:var(--text)}.strip button.on{color:var(--accent);border-left-color:var(--accent);background:var(--s2)}

.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--s0);border-right:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:8px;padding:0 10px;height:32px;flex:none;background:var(--s1);border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mute)}
.pb{flex:1;min-height:0;overflow:auto;padding:10px}

/* ---- media bin ---- */
.bin.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--s1);cursor:pointer}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.card.cur .tn{filter:brightness(1.25)}.card.over{outline:2px solid var(--green)}
.tn{aspect-ratio:9/16;max-height:150px;width:100%;background:#000 center/cover;display:block;object-fit:cover}
.card.wide .tn{aspect-ratio:16/9}
.card .meta{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:11px;color:var(--mute)}
.badge{position:absolute;left:4px;top:4px;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.7);color:#fff;letter-spacing:.4px}
.badge.vid{background:var(--green)}.num{position:absolute;right:4px;top:4px;font-size:10px;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:4px}

/* ---- program monitor ---- */
.mon{border-right:0;background:#07080b}
.monbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
.stage{position:relative;height:100%;max-width:100%;background:#000;border:1px solid var(--line);overflow:hidden}
.handle{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(229,176,75,.85);cursor:ns-resize;z-index:5}
.handle span{position:absolute;right:8px;top:-12px;background:var(--accent);color:#1b1400;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.trans{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;border-top:1px solid var(--line);background:var(--s1);flex:none}
.tc{font-size:15px;color:#9be39b;background:#06080a;border:1px solid var(--line);padding:3px 9px;border-radius:5px;min-width:112px;text-align:center}

/* ---- inspector ---- */
.insp{border-right:1px solid var(--line)}
.pbody h4{margin:16px 0 7px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}.pbody h4:first-child{margin-top:0}
.f{margin-bottom:9px;display:flex;flex-direction:column;gap:4px}.f label{font-size:11.5px;color:var(--mute)}.tg{display:flex;gap:8px;align-items:center;margin:4px 0 8px}
.sl{display:flex;gap:8px;align-items:center}.sl span{color:var(--mute);font-size:12px;width:34px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.help{color:var(--dim);font-size:12px;margin:0 0 10px;line-height:1.45}
.ln{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;background:var(--bg)}.lh{display:flex;gap:8px;font-size:12px;color:var(--mute);margin-bottom:6px}.lh a{color:var(--accent);cursor:pointer}
.thumb{aspect-ratio:16/9;max-height:150px;background:#000;border-radius:6px;overflow:hidden;margin-bottom:10px;display:grid;place-items:center}.thumb img,.thumb video{width:100%;height:100%;object-fit:contain}.none{color:var(--dim)}
.flow{border:1px solid #3a3320;background:#171409;border-radius:8px;padding:10px;margin-bottom:12px}
.flow textarea{background:#0e0c05;border-color:#3a3320;font-size:12.5px;line-height:1.45}
.warn{color:#e8b05a;font-size:12px;margin:4px 0 8px}

/* ---- timeline ---- */
.tlp{border-right:0;background:var(--bg)}
.tltools{display:flex;align-items:center;gap:6px;padding:0 8px;height:34px;flex:none;background:var(--s1);border-bottom:1px solid var(--line)}
.tltools input[type=range]{width:110px}
.tlscroll{flex:1;min-height:0;overflow:auto;position:relative}
.tlin{position:relative;min-height:100%}
.row-t{display:flex;height:38px;border-bottom:1px solid var(--line)}
.row-t.ruler{height:26px;position:sticky;top:0;z-index:6;background:var(--s1)}
.lab{position:sticky;left:0;z-index:5;flex:none;width:88px;background:var(--s1);border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:11px;font-weight:700;color:var(--mute)}
.lab i{font-style:normal;color:var(--text);background:var(--s3);border-radius:3px;padding:1px 5px;font-size:10px}
.lane{position:relative;flex:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--pps)*1px - 1px),rgba(255,255,255,.035) calc(var(--pps)*1px - 1px),rgba(255,255,255,.035) calc(var(--pps)*1px))}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);font-size:10px;color:var(--mute);padding:4px 0 0 4px;pointer-events:none}
.chapm{position:absolute;top:0;bottom:0;width:2px;background:#6aa8ef}
.clip{position:absolute;top:3px;bottom:3px;border-radius:4px;overflow:hidden;font-size:10.5px;color:#fff;padding:3px 6px;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:1px solid rgba(255,255,255,.18);background-size:cover;background-position:center}
.clip.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.clip.v{background-color:#27507a}.clip.v.vid{background-color:#1f7a5c}.clip.v.none{background-color:#3a3f4b}
.clip.v span{background:rgba(0,0,0,.55);padding:0 4px;border-radius:3px}
.clip.c{background:#b9852a;color:#1b1400}.clip.s{background:#6d45cf}.clip.a{background:#4a4ab8}.clip.m{background:#0f8585}
.clip.a,.clip.m{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,transparent 2px 5px);background-size:auto 60%;background-repeat:repeat-x;background-position:0 50%}
.cut{position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;cursor:ew-resize;z-index:3}.cut:hover{background:rgba(229,176,75,.55)}
.ph-line{position:absolute;top:0;bottom:0;width:2px;background:#ff5b5b;z-index:4;pointer-events:none}
.ph-line::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#ff5b5b;border-bottom:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:#1b1400;font-weight:600;padding:8px 16px;border-radius:8px;z-index:50}
@media(max-width:1000px){.top{grid-template-columns:1fr}.bot{grid-template-columns:1fr}.ed{--bh:60vh}}
</style></head><body><div id="root"></div><script src="/editor.js"></script></body></html>
