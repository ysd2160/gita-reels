<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Video editor</title>
<style>
:root{--bg:#0d0f14;--s1:#141720;--s2:#1a1e29;--line:#252a37;--line2:#303646;--text:#e8eaf0;--mute:#8b93a7;--dim:#5d6577;--accent:#e5b04b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body,#root{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none;width:100%}
input[type=range]{padding:0;accent-color:var(--accent)} input[type=color]{padding:2px;height:34px} input[type=checkbox]{width:auto}
.center{height:100%;display:grid;place-content:center;gap:12px;text-align:center;color:var(--mute)}
.ed{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--s1)}
.grow{flex:1}.mut{color:var(--mute);font-size:12.5px}
.btn{display:inline-flex;align-items:center;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--s2);cursor:pointer;font-weight:500;text-decoration:none;color:var(--text)}
.btn.sm{padding:6px 10px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1400;font-weight:600}.btn.bad:hover{color:#ef6a6a}.btn:disabled{opacity:.5}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.stagewrap{display:flex;flex-direction:column;min-height:0;padding:16px;gap:12px;align-items:center}
.stage{position:relative;max-height:calc(100vh - 190px);max-width:100%;height:calc(100vh - 190px);background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.handle{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(229,176,75,.85);cursor:ns-resize;z-index:5}
.handle span{position:absolute;right:8px;top:-12px;background:var(--accent);color:#1b1400;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.tl{width:100%;max-width:1100px}.tl-scenes{position:relative;display:flex;gap:2px;height:44px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--s1)}
.blk{position:relative;background:#222836 center/cover;cursor:pointer;min-width:6px;opacity:.85}.blk.on{outline:2px solid var(--accent);outline-offset:-2px;opacity:1}.blk.cur{filter:brightness(1.25)}
.blk i{position:absolute;left:4px;top:2px;font-size:10px;color:#fff;font-style:normal;text-shadow:0 1px 3px #000}
.head{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}.chap{position:absolute;top:0;bottom:0;width:2px;background:#6aa8ef;pointer-events:none}
.panel{border-left:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;min-height:0}
.panel nav{display:flex;border-bottom:1px solid var(--line)}.panel nav button{flex:1;padding:11px 4px;border:0;background:none;color:var(--mute);cursor:pointer;text-transform:capitalize;border-bottom:2px solid transparent}
.panel nav button.on{color:var(--text);border-bottom-color:var(--accent)}
.pbody{padding:16px;overflow:auto;flex:1}.pbody h4{margin:18px 0 8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}.pbody h4:first-child{margin-top:0}
.f{margin-bottom:10px;display:flex;flex-direction:column;gap:4px}.f label{font-size:12px;color:var(--mute)}.tg{display:flex;gap:8px;align-items:center;margin:4px 0 8px;font-size:13px}
.sl{display:flex;gap:8px;align-items:center}.sl span{color:var(--mute);font-size:12px;width:34px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:8px;margin-bottom:10px}.help{color:var(--dim);font-size:12.5px;margin:0 0 12px}
.ln{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}.lh{display:flex;gap:8px;font-size:12px;color:var(--mute);margin-bottom:6px}.lh a{color:var(--accent);cursor:pointer}
.thumb{aspect-ratio:16/9;max-height:170px;background:#000;border-radius:8px;overflow:hidden;margin-bottom:10px;display:grid;place-items:center}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.none{color:var(--dim)}
@media(max-width:1000px){.body{grid-template-columns:1fr}.panel{height:50vh}}
</style></head><body><div id="root"></div><script src="/editor.js"></script></body></html>
